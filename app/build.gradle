plugins {
    id 'com.android.application'
}

android {
    namespace 'com.masheeds.player'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.masheeds.player'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3'
    }

    buildFeatures {
        buildConfig true
    }

    bundle {
        language {
            // Both languages must be available when the app switches languages offline.
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
